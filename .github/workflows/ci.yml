name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint the scripts and plists
        run: make lint

      - name: Check the changelog
        run: Scripts/changelog.sh check

      - name: Test signing failure gates without credentials
        run: make signing-test

      - name: Build
        run: Scripts/swiftw.sh build

      # Needs the build above: SwiftPM downloads Sparkle's signing tools with the package.
      - name: Test appcast signing with the real Sparkle tools
        run: make updater-test

      - name: Test
        run: Scripts/swiftw.sh test

      # Exercises the same path as a release: build, bundle, ad-hoc sign and verify Barback.app.
      - name: Assemble Barback.app
        env:
          SWIFTW_BUILD_SYSTEM: native
        run: |
          make app
          plutil -p dist/Barback.app/Contents/Info.plist

      - name: Render the Homebrew cask
        run: Scripts/render_cask.sh --version "$(cat VERSION)" --sha256 "$(printf '0%.0s' {1..64})" > /dev/null

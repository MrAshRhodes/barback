name: Release

# Pushing a tag such as v1.2.3 builds a universal Barback.app, publishes the GitHub release with
# that version's CHANGELOG.md section as its notes and, when the TAP_GITHUB_TOKEN secret exists,
# updates the Homebrew cask in MrAshRhodes/homebrew-tap. A published release is never rebuilt or
# overwritten, because the cask pins the sha256 of its zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SWIFTW_BUILD_SYSTEM: native

jobs:
  release:
    name: Build and publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_re='^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$'
          if [[ ! $version =~ $version_re ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version tag such as v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$file_version" ]]; then
            echo "::warning title=Version mismatch::Tag $GITHUB_REF_NAME does not match the VERSION file ($file_version). Releasing $version."
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          # Published assets are immutable: the Homebrew cask pins the zip's sha256, and every
          # build differs byte for byte, so replacing an asset would break `brew install`.
          exists=false
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            exists=true
            echo "::notice title=Release already published::$GITHUB_REF_NAME already has a release, so nothing is rebuilt or replaced. Cut a new version to publish new artifacts."
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      # Fails in seconds, before the build, if CHANGELOG.md at the tag has no section for this
      # version. Pre-releases may use the Unreleased entries instead.
      - name: Check the changelog
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--allow-unreleased)
          fi
          Scripts/changelog.sh check
          Scripts/changelog.sh notes "$VERSION" ${flags[@]+"${flags[@]}"} > "$RUNNER_TEMP/changelog.md"

      - name: Show the toolchain
        if: steps.version.outputs.exists != 'true'
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        if: steps.version.outputs.exists != 'true'
        run: |
          make signing-test
          Scripts/swiftw.sh test

      - name: Import the signing identity
        id: signing
        if: steps.version.outputs.exists != 'true'
        env:
          BARBACK_SIGNING_P12_BASE64: ${{ secrets.BARBACK_SIGNING_P12_BASE64 }}
          BARBACK_SIGNING_P12_PASSWORD: ${{ secrets.BARBACK_SIGNING_P12_PASSWORD }}
        run: Scripts/import_signing_identity.sh > /dev/null

      - name: Prepare notarization credentials
        if: steps.version.outputs.exists != 'true'
        env:
          BARBACK_NOTARY_KEY_P8_BASE64: ${{ secrets.BARBACK_NOTARY_KEY_P8_BASE64 }}
          BARBACK_NOTARY_KEY_ID: ${{ secrets.BARBACK_NOTARY_KEY_ID }}
          BARBACK_NOTARY_ISSUER_ID: ${{ secrets.BARBACK_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${BARBACK_NOTARY_KEY_P8_BASE64:?Missing notarization key secret}"
          export BARBACK_NOTARY_KEY_PATH="$RUNNER_TEMP/barback-notary.p8"
          printf '%s' "$BARBACK_NOTARY_KEY_P8_BASE64" | base64 --decode > "$BARBACK_NOTARY_KEY_PATH"
          Scripts/notarize.sh --check-credentials

      - name: Build and package
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BARBACK_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          BARBACK_NOTARY_KEY_PATH: ${{ runner.temp }}/barback-notary.p8
          BARBACK_NOTARY_KEY_ID: ${{ secrets.BARBACK_NOTARY_KEY_ID }}
          BARBACK_NOTARY_ISSUER_ID: ${{ secrets.BARBACK_NOTARY_ISSUER_ID }}
        run: Scripts/package_release.sh --version "$VERSION" --formats zip,dmg --require-universal --notarize --build-number "$GITHUB_RUN_NUMBER"

      - name: Remove notarization credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/barback-notary.p8"

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: Scripts/import_signing_identity.sh --cleanup "$KEYCHAIN"

      - name: Publish the GitHub release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          assets=(
            "dist/Barback-$VERSION.zip"
            "dist/Barback-$VERSION.zip.sha256"
            "dist/Barback-$VERSION.dmg"
            "dist/Barback-$VERSION.dmg.sha256"
          )
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          # The changelog section comes first, then the install and update instructions.
          {
            if [[ -s "$RUNNER_TEMP/changelog.md" ]]; then
              echo "## What's changed"
              echo
              cat "$RUNNER_TEMP/changelog.md"
              echo
            fi
            sed "s/@VERSION@/$VERSION/g" .github/release-notes-header.md
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Barback $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ${flags[@]+"${flags[@]}"}

  tap:
    name: Update the Homebrew tap
    needs: release
    if: needs.release.outputs.prerelease != 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    # One tap update at a time across every tag, so releases pushed close together (or a re-run of an
    # older release) can't race. update_tap.sh also refuses to replace a newer cask with an older one.
    concurrency:
      group: tap-update
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for a Homebrew tap token
        id: tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ -n "$TAP_GITHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Homebrew tap not updated::Add a TAP_GITHUB_TOKEN secret (a token that can push to MrAshRhodes/homebrew-tap) to update the cask automatically, or run Scripts/update_tap.sh --version $RELEASE_VERSION --from-release yourself."
          fi

      - name: Update the Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: Scripts/update_tap.sh --version "$VERSION" --from-release

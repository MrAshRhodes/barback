name: Feature request
description: Suggest an idea for Barback
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Barback aims to stay fast and permission-free; mention if your idea needs Screen Recording or Accessibility access.
    validations:
      required: true

name: Bug report
description: Something in Barback does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ⌘-drag … to the left of the separator
        2. Click the chevron
        3. …
    validations:
      required: true
  - type: input
    id: barback-version
    attributes:
      label: Barback version
      description: Settings → About, or `defaults read /Applications/Barback.app/Contents/Info CFBundleShortVersionString`
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.1, MacBook Pro 14" (notch)
    validations:
      required: true
  - type: textarea
    id: other-apps
    attributes:
      label: Other menu bar managers
      description: Are Bartender, Ice, Hidden Bar or similar apps also running? Paste any relevant Console.app logs for subsystem `io.github.mrashrhodes.barback`.
